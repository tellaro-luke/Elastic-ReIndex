[project]
name = "elastic-reindex"
version = "2.0.0"
description = "Bulk reindex a list of OpenSearch indices with checkpointing, verification, and a live dashboard"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "opensearch-py>=2.6,<4",
    "rich>=13,<15",
]

[project.scripts]
reindex = "reindex:main"

[tool.poetry]
packages = [{ include = "reindex.py" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
